appId: com.warungmadura.pos
productName: POS Warung Madura
copyright: Copyright © 2026 Abroril Huda

directories:
  output: release
  buildResources: resources

# Menggunakan asar: false untuk kompatibilitas spawn node server eksternal
asar: false

files:
  - "build/**/*"
  - "dist-electron/**/*"
  - "server/**/*"
  - "migrations/**/*"
  - "public/icons/**/*"
  - "package.json"
  - "!resources/**/*"
  - "!**/*.map"
  - "!**/*.pdb"
  - "!**/*.ts"
  - "!**/*.tsx"

extraResources:
  - from: "resources/mysql/bin"
    to: "mysql/bin"
    filter:
      - "!**/*.pdb"
      - "!**/*.lib"
      - "!**/*.pl"
  - from: "resources/mysql/lib"
    to: "mysql/lib"
    filter:
      - "!**/*.pdb"
      - "!**/*.lib"
  - from: "resources/mysql/share"
    to: "mysql/share"
  - from: "migrations/schema.sql"
    to: "migrations/schema.sql"

win:
  icon: "public/icons/icon.ico"
  compression: "maximum"
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: POS Warung Madura
  installerIcon: "public/icons/icon.ico"
  uninstallerIcon: "public/icons/icon.ico"
  differentialPackage: false
